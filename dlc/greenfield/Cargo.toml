[package]
name = "greenfield_dlc"
version = "0.1.0"
edition = "2021"
description = "Hearthfield DLC: a tower-defense farming survival arena"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_state",
    "multi_threaded",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "tonemapping_luts",
    "ktx2",
    "zstd",
    "bevy_winit",
    "x11",
    "png",
    "default_font",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironclad = { path = "../../ironclad" }

[[bin]]
name = "greenfield_dlc"
path = "src/main.rs"
